name: Bitvavo Signale

# Ein Durchgang läuft knapp 6 Stunden und prüft dabei alle 5 Minuten (run-loop.sh).
# Am Ende startet er selbst den nächsten. Der Zeitplan unten ist nur die Reserve,
# falls die Kette einmal abreisst.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # Logbuch im Branch "logs" speichern
  actions: write    # nächsten Durchgang starten

concurrency:
  group: signale
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Alle 5 Minuten prüfen (knapp 6 Stunden lang)
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POSITIONS: ${{ secrets.POSITIONS }}
          BITVAVO_KEY: ${{ secrets.BITVAVO_KEY }}        # nur «Anzeigen» und «Handeln», ohne Auszahlung
          BITVAVO_SECRET: ${{ secrets.BITVAVO_SECRET }}
          TF: ${{ vars.TF || '1h' }}
          MIN_LEVEL: ${{ vars.MIN_LEVEL || '2' }}
          LOG_DIR: logdata
        run: ./run-loop.sh
