name: Rückwärtstest
# Manuell gestartete Auswertungen (z. B. Top 5 mit Trendfilter 50 Tage). Ergebnis als Download-Paket am Lauf.
on:
  workflow_dispatch:
    inputs:
      skript:
        description: 'Skript im Ordner research'
        default: 'top5_backtest.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        working-directory: research
        run: node "${{ inputs.skript }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ergebnis
          path: research/ergebnis/
